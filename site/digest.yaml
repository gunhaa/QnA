# 요약본(digest) 연결
#
# 이 사이트의 knowledge 문서는 요약하기 전의 원본이다.
# 요약본은 computer_study 저장소(https://github.com/gunhaa/computer_study)에 분야당 문서 하나로 정리하고,
# 여기에 그 위치(경로, 필요하면 #앵커까지)를 적는다.
#
# 모든 세트와 문서 페이지에는 요약본 링크가 붙는다.
#   - 위치를 적은 곳: "digest" → 적은 위치
#   - 적지 않은 곳:   "digest (soon)" → computer_study 첫 화면
#
# 키: knowledge/ 기준 경로. 세 단계 중 하나
#   대주제   database
#   세트     database/0002-redis
#   문서     database/0002-redis/03-tradeoffs
# 값: computer_study 안 경로(폴더 또는 .md 파일, #앵커 가능). 다른 곳이면 https://로 시작하는 전체 주소
#
# 더 구체적인 단계가 우선한다 (문서 → 세트 → 대주제). 대주제만 적으면 그 아래 세트·문서가 모두 그 위치로 간다.
# 첫 화면에서 대주제·문서 단계는 적었을 때만 제목 옆·문서 링크 옆 위첨자로 따로 보인다.
# 키에 없는 경로를 적으면 빌드가 실패한다. 값(computer_study 쪽 경로·앵커)은 검사하지 않는다.
#
# 예:
#   database: CS/Database/Digest.md
#   database/0002-redis: CS/Database/Digest.md#redis
#   database/0002-redis/03-tradeoffs: CS/Database/Digest.md#redis-트레이드오프
{}
