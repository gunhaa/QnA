# knowledge/ 를 Tufte CSS 정적 사이트로 빌드해 GitHub Pages에 배포한다.
# 빌드 스크립트와 스타일은 site/ 에 있다.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build
        working-directory: site
        env:
          # 조회수 API 주소. 저장소 Settings → Secrets and variables → Actions → Variables에서 정한다
          VIEWS_API: ${{ vars.VIEWS_API }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
